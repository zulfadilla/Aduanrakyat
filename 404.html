<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YB Kasi Setel</title>
<meta name="robots" content="noindex">
<script>
  // Link pendek setiap YB: /bm  ->  /?yb=bm  (berfungsi di GitHub Pages dan Cloudflare Pages)
  (function () {
    var path = location.pathname;
    var m = path.match(/^(.*\/)([A-Za-z0-9]{1,12})\/?$/);
    if (m) location.replace(m[1] + '?yb=' + m[2].toLowerCase() + location.hash);
  })();
</script>
<style>
  :root { --bg: #f4f5f9; --text: #141a2e; --muted: #5d6680; --accent: #c8102e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0a1130; --text: #e9ecf6; --muted: #9aa4c4; --accent: #e8334f; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  a { color: #fff; background: var(--accent); padding: 10px 18px; border-radius: 10px; text-decoration: none; font-weight: 600; }
  p { color: var(--muted); }
</style>
</head>
<body>
  <div>
    <h1>Halaman tidak dijumpai</h1>
    <p>Link ini mungkin salah ejaan.</p>
    <a id="home" href="./">Ke halaman aduan</a>
  </div>
  <script>document.getElementById('home').href = location.pathname.replace(/[^/]*\/?$/, '') || '/';</script>
</body>
</html>
